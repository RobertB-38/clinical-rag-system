# Corpus manifest — the NCEC National Clinical Guidelines suite (Ireland).
# Published by Ireland's Department of Health / National Clinical Effectiveness
# Committee (NCEC) and the HSE. Source collection:
#   https://www.gov.ie/en/department-of-health/collections/national-clinical-guidelines/
#
# LICENCE: gov.ie publishes a specific IP notice for these guidelines:
#   https://assets.gov.ie/static/documents/national-clinical-guidelines-intellectual-property.pdf
# Index the PDFs locally; do NOT commit them unless that notice allows it.
# data/raw/*.pdf is gitignored. This manifest is the committed, shareable record.
#
# Ordered by download priority (BATCH 1 first = richest clinical Q&A / best demo
# material). You do not need all of them to have a working, impressive demo —
# Batch 1 alone is enough. Add later batches for volume.
#
# To build: download each `url`'s PDF into data/raw/ as the exact `file` name,
# set `retrieved`, then:  python -m app.ingest.run  &&  python -m eval.run_eval

