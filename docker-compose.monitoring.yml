# Lightweight observability: Prometheus + Grafana ONLY, scraping the API you
# already run locally (uvicorn on :8000). No image build needed.
#   docker compose -f docker-compose.monitoring.yml up
# Grafana: http://localhost:3000 (admin/admin) — dashboard auto-provisioned.
# Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.host.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
